<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alert Hub</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@300;400;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

        :root {
            --gold: #f5c842;
            --glass: rgba(255,255,255,0.08);
            --glass-border: rgba(255,255,255,0.18);
            --shadow: 0 8px 40px rgba(0,0,0,0.45);
            --radius: 28px;
        }

        body {
            font-family: 'DM Sans', sans-serif;
            margin: 0;
            color: white;
            height: 100vh;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: #0a0a0f;
        }

        #background-video {
            position: fixed;
            inset: 0;
            width: 100%; height: 100%;
            object-fit: cover;
            z-index: 0;
            pointer-events: none;
            filter: brightness(0.55) saturate(0.85);
        }

        #clock-screen {
            position: relative;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
        }

        #test-btn {
            position: absolute;
            top: -80px;
            left: 50%;
            transform: translateX(-50%);
            width: 180px; height: 60px;
            background: transparent;
            border: none;
            cursor: pointer;
            z-index: 10;
            opacity: 0;
        }

        .time-wrap {
            display: flex;
            align-items: flex-start;
            gap: 14px;
            line-height: 1;
        }

        #current-time {
            font-family: 'Space Mono', monospace;
            font-size: clamp(5rem, 18vw, 10rem);
            font-weight: 700;
            letter-spacing: -4px;
            text-shadow: 0 4px 32px rgba(0,0,0,0.7);
        }

        .time-meta {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            padding-top: 14px;
            gap: 6px;
        }

        #ampm {
            font-family: 'Space Mono', monospace;
            font-size: 1.5rem;
            font-weight: 700;
            color: var(--gold);
            letter-spacing: 2px;
        }

        #current-date {
            font-size: 0.95rem;
            font-weight: 400;
            opacity: 0.72;
            letter-spacing: 0.3px;
            white-space: nowrap;
        }

        #upcoming-pill {
            margin-top: 28px;
            display: none;
            align-items: center;
            gap: 10px;
            background: var(--glass);
            border: 1px solid var(--glass-border);
            backdrop-filter: blur(12px);
            padding: 12px 24px;
            border-radius: 9999px;
            font-size: 0.95rem;
            font-weight: 600;
            color: rgba(255,255,255,0.85);
            animation: fadeUp 0.4s ease;
        }
        #upcoming-pill.show { display: flex; }
        #upcoming-pill .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--gold);
            animation: pulse 1.4s infinite;
        }

        #countdown {
            margin-top: 14px;
            display: none;
            align-items: center;
            gap: 10px;
            background: rgba(245,200,66,0.15);
            border: 1px solid rgba(245,200,66,0.35);
            backdrop-filter: blur(12px);
            padding: 12px 28px;
            border-radius: 9999px;
            color: var(--gold);
            font-weight: 700;
            font-size: 1rem;
        }
        #countdown.show { display: flex; }

        #dev-menu {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.75);
            backdrop-filter: blur(6px);
            z-index: 200;
            align-items: center;
            justify-content: center;
        }
        #dev-menu.open { display: flex; }

        .menu-box {
            background: #1a1a24;
            border: 1px solid rgba(255,255,255,0.1);
            color: white;
            width: 92%;
            max-width: 440px;
            border-radius: var(--radius);
            padding: 24px 20px;
            max-height: 82vh;
            overflow-y: auto;
            box-shadow: var(--shadow);
        }
        .menu-box h2 {
            text-align: center;
            font-size: 1rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            opacity: 0.45;
            margin-bottom: 18px;
        }
        .menu-item {
            padding: 15px 18px;
            margin: 6px 0;
            background: rgba(255,255,255,0.05);
            border: 1px solid rgba(255,255,255,0.07);
            border-radius: 16px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background 0.15s, border-color 0.15s;
        }
        .menu-item:hover {
            background: rgba(245,200,66,0.12);
            border-color: rgba(245,200,66,0.3);
        }
        .menu-item .badge {
            font-size: 0.82rem;
            font-weight: 400;
            opacity: 0.5;
            font-family: 'Space Mono', monospace;
        }

        #alert-screen {
            display: none;
            position: fixed;
            inset: 0;
            z-index: 150;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(8px);
        }
        #alert-screen.open { display: flex; }

        .alert-card {
            background: #ffffff;
            color: #111827;
            width: 100%;
            max-width: 420px;
            border-radius: var(--radius);
            overflow: hidden;
            box-shadow: 0 32px 64px rgba(0,0,0,0.6);
            animation: popIn 0.35s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .alert-header {
            background: linear-gradient(135deg, #1e3a5f 0%, #2d5a8e 100%);
            color: white;
            text-align: center;
            padding: 18px 24px;
            font-size: 0.85rem;
            font-weight: 700;
            letter-spacing: 3px;
            text-transform: uppercase;
        }

        .alert-body {
            padding: 32px 28px 28px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 22px;
        }

        #alert-text {
            font-size: 1.85rem;
            font-weight: 700;
            text-align: center;
            color: #111827;
            line-height: 1.2;
        }

        .image-frame {
            width: 210px;
            height: 210px;
            border-radius: 20px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.15);
            border: 3px solid #e5e7eb;
        }
        .image-frame img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .alert-actions {
            display: flex;
            gap: 12px;
            width: 100%;
        }
        .alert-actions button {
            flex: 1;
            padding: 18px 12px;
            font-size: 1rem;
            font-weight: 700;
            border-radius: 16px;
            border: none;
            cursor: pointer;
            transition: transform 0.1s, filter 0.1s;
            font-family: 'DM Sans', sans-serif;
        }
        .alert-actions button:active { transform: scale(0.96); }
        .btn-complete { background: #111827; color: white; }
        .btn-snooze   { background: #f3f4f6; color: #374151; }
        .btn-complete:hover { filter: brightness(1.25); }
        .btn-snooze:hover   { background: #e5e7eb; }

        @keyframes pulse {
            0%,100% { opacity:1; transform:scale(1); }
            50%      { opacity:0.4; transform:scale(0.7); }
        }
        @keyframes fadeUp {
            from { opacity:0; transform:translateY(10px); }
            to   { opacity:1; transform:translateY(0); }
        }
        @keyframes popIn {
            from { opacity:0; transform:scale(0.88) translateY(20px); }
            to   { opacity:1; transform:scale(1) translateY(0); }
        }
    </style>
</head>
<body>

    <video id="background-video" autoplay loop muted playsinline>
        <source src="background.mp4" type="video/mp4">
    </video>

    <div id="clock-screen">
        <button id="test-btn" onclick="showDevMenu()"></button>
        <div class="time-wrap">
            <div id="current-time">12:00:00</div>
            <div class="time-meta">
                <div id="ampm">AM</div>
                <div id="current-date">Loading...</div>
            </div>
        </div>
        <div id="upcoming-pill">
            <span class="dot"></span>
            <span id="upcoming-text">Next alarm</span>
        </div>
        <div id="countdown">
            <span>⏳</span>
            <span id="countdown-text">Returning in 5:00</span>
        </div>
    </div>

    <div id="dev-menu" onclick="if(event.target.id==='dev-menu') hideDevMenu()">
        <div class="menu-box" onclick="event.stopImmediatePropagation()">
            <h2>Test Reminders</h2>
            <div id="menu-list"></div>
        </div>
    </div>

    <div id="alert-screen">
        <div class="alert-card">
            <div class="alert-header">🛎️ &nbsp; Reminder &nbsp; 🛎️</div>
            <div class="alert-body">
                <div id="alert-text">Reminder</div>
                <div class="image-frame">
                    <img id="alert-image" src="" alt="">
                </div>
                <div class="alert-actions">
                    <button class="btn-complete" onclick="completeTask()">✅ Done</button>
                    <button class="btn-snooze"   onclick="snoozeTask()">⏰ +5 min</button>
                </div>
            </div>
        </div>
    </div>

    };

    const reminders = [
        { id:1,  time:"03:30", text:"Take pills",             image: IMAGES.takepills,     soft:true  },
        { id:2,  time:"03:35", text:"Cold shower",            image: IMAGES.coldshower,    soft:true  },
        { id:3,  time:"03:50", text:"Brush teeth",            image: IMAGES.brushteeth,    soft:true  },
        { id:4,  time:"03:55", text:"Teeth whitener",         image: IMAGES.teethwhitener, soft:true  },
        { id:5,  time:"04:00", text:"Ice water bowl on face", image: IMAGES.iceface,       soft:true  },
        { id:6,  time:"04:10", text:"Mindfulness",            image: IMAGES.meditation,    soft:true  },
        { id:7,  time:"04:20", text:"Brain training",         image: IMAGES.braintraining, soft:true  },
        { id:8,  time:"04:30", text:"Clean everything",       image: IMAGES.planningday,   soft:true  },
        { id:9,  time:"04:40", text:"Plan your day",          image: IMAGES.planningday,   soft:true  },
        { id:10, time:"17:00", text:"Workout",                image: IMAGES.workout,       soft:false },
        { id:11, time:"18:00", text:"Walk the dog",           image: IMAGES.walkdog,       soft:false },
    ];

    const firedThisMinute = new Set();
    let currentReminder = null, countdownTimer = null,
        remainingSeconds = 0, soundHandle = null;

    function playSound(soft) {
        stopSound();
        try {
            const ctx  = new (window.AudioContext || window.webkitAudioContext)();
            const freq = soft ? 430 : 700, vol = soft ? 0.28 : 0.65;
            const gap  = soft ? 950 : 600, dur = soft ? 0.55 : 0.30;
            const reps = soft ? 10  : 18;
            let count = 0;
            soundHandle = setInterval(() => {
                if (count >= reps) { clearInterval(soundHandle); return; }
                const osc = ctx.createOscillator(), gain = ctx.createGain();
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + dur);
                osc.connect(gain).connect(ctx.destination);
                osc.start(); osc.stop(ctx.currentTime + dur + 0.05);
                count++;
            }, gap);
        } catch(e) {}
    }

    function stopSound() {
        if (soundHandle) { clearInterval(soundHandle); soundHandle = null; }
    }

    function showAlert(r) {
        currentReminder = r;
        document.getElementById('alert-text').textContent = r.text;
        document.getElementById('alert-image').src = r.image;
        document.getElementById('alert-screen').classList.add('open');
        playSound(r.soft);
    }

    function hideAlert() {
        stopSound();
        document.getElementById('alert-screen').classList.remove('open');
    }

    function completeTask() { hideAlert(); currentReminder = null; }

    function snoozeTask() {
        if (!currentReminder) return;
        const r = currentReminder;
        hideAlert();
        remainingSeconds = 300;
        document.getElementById('countdown').classList.add('show');
        updateCountdown();
        countdownTimer = setInterval(() => {
            remainingSeconds--;
            updateCountdown();
            if (remainingSeconds <= 0) {
                clearInterval(countdownTimer);
                document.getElementById('countdown').classList.remove('show');
                showAlert(r);
            }
        }, 1000);
    }

    function updateCountdown() {
        const m = Math.floor(remainingSeconds / 60);
        const s = (remainingSeconds % 60).toString().padStart(2, '0');
        document.getElementById('countdown-text').innerHTML =
            `Returning in <strong>${m}:${s}</strong>`;
    }

    function updateUpcomingPill(h24, min) {
        const now  = h24 * 60 + min;
        const pill = document.getElementById('upcoming-pill');
        let closest = null, minDiff = Infinity;
        for (const r of reminders) {
            const [rh, rm] = r.time.split(':').map(Number);
            let diff = (rh * 60 + rm) - now;
            if (diff < 0) diff += 1440;
            if (diff > 0 && diff < minDiff) { minDiff = diff; closest = r; }
        }
        if (closest && minDiff <= 60) {
            const [rh, rm] = closest.time.split(':').map(Number);
            const disp = `${rh % 12 || 12}:${rm.toString().padStart(2,'0')} ${rh>=12?'PM':'AM'}`;
            document.getElementById('upcoming-text').textContent =
                `Next: ${closest.text} at ${disp}`;
            pill.classList.add('show');
        } else {
            pill.classList.remove('show');
        }
    }

    function startClock() {
        const timeEl = document.getElementById('current-time');
        const ampmEl = document.getElementById('ampm');
        const dateEl = document.getElementById('current-date');
        const alertScr = document.getElementById('alert-screen');

        function tick() {
            const now  = new Date();
            const h24  = now.getHours();
            const min  = now.getMinutes().toString().padStart(2,'0');
            const sec  = now.getSeconds().toString().padStart(2,'0');
            const ampm = h24 >= 12 ? 'PM' : 'AM';
            const h12  = (h24 % 12 || 12).toString();

            timeEl.textContent = `${h12}:${min}:${sec}`;
            ampmEl.textContent = ampm;
            dateEl.textContent = now.toLocaleDateString('en-AU', {
                weekday:'long', day:'numeric', month:'long', year:'numeric'
            });

            const key = `${h24.toString().padStart(2,'0')}:${min}`;
            if (sec === '00') firedThisMinute.clear();

            if (!alertScr.classList.contains('open')) {
                for (const r of reminders) {
                    if (r.time === key && !firedThisMinute.has(r.id)) {
                        firedThisMinute.add(r.id);
                        showAlert(r);
                        break;
                    }
                }
            }
            updateUpcomingPill(h24, now.getMinutes());
        }
        tick();
        setInterval(tick, 1000);
    }

    function showDevMenu() {
        const list = document.getElementById('menu-list');
        list.innerHTML = '';
        reminders.forEach(r => {
            const div = document.createElement('div');
            div.className = 'menu-item';
            const [rh, rm] = r.time.split(':').map(Number);
            const disp = `${rh % 12 || 12}:${rm.toString().padStart(2,'0')} ${rh>=12?'PM':'AM'}`;
            div.innerHTML = `<span>${r.text}</span><span class="badge">${disp}</span>`;
            div.onclick = () => { hideDevMenu(); showAlert(r); };
            list.appendChild(div);
        });
        document.getElementById('dev-menu').classList.add('open');
    }

    function hideDevMenu() {
        document.getElementById('dev-menu').classList.remove('open');
    }

    startClock();
</script>
